# The Warcryer website, warcryer.org: plain files built by Astro (infra/deploy.sh
# puts them in /var/www/warcryer.org/current). Installed by infra/setup-root.sh.
#
# Visitors arrive through Cloudflare. This server does not ask Cloudflare who
# the visitor is, so the log below holds Cloudflare's address, not theirs;
# the privacy policy says so. Logs rotate with the others (15 days).
#
# Two addresses are not files:
#   /api/status   the app's own status check (the web app on 127.0.0.1:4310),
#                 each answer kept 15 seconds so visitors cannot load it;
#   /api/release  GitHub's record of the newest release, kept 10 minutes, so
#                 the download page names the newest installer without a
#                 rebuild and visitors' browsers never contact GitHub for it.

proxy_cache_path /var/cache/nginx/warcryer levels=1 keys_zone=warcryer:1m max_size=10m inactive=7d use_temp_path=off;

# How long browsers and Cloudflare may keep each kind of file. Astro's own
# files carry a hash in their names, so they never change.
map $uri $warcryer_cache {
    ~^/_astro/          "public, max-age=31536000, immutable";
    ~^/(fonts|shots)/   "public, max-age=604800";
    ~^/api/             "no-store";
    default             "public, max-age=300";
}

server {
    listen 80;
    listen [::]:80;
    server_name warcryer.org www.warcryer.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/voice-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://warcryer.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.warcryer.org;
    include /etc/nginx/warcryer-cert.conf;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/voice-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://warcryer.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name warcryer.org;
    include /etc/nginx/warcryer-cert.conf;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/warcryer.org/current;
    index index.html;
    access_log /var/log/nginx/warcryer.org.access.log;
    error_log  /var/log/nginx/warcryer.org.error.log warn;
    client_max_body_size 16k;

    add_header Cache-Control $warcryer_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/xml text/plain;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/voice-acme;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;

    # The old GitHub Pages site had its sitemap here.
    location = /sitemap.xml { return 301 /sitemap-index.xml; }

    location = /api/status {
        proxy_pass http://127.0.0.1:4310/api/status;
        proxy_http_version 1.1;
        proxy_set_header Host ignite.v1rtopia.com;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_cache warcryer;
        proxy_cache_key "status";
        proxy_cache_valid 200 503 15s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /api/release {
        resolver 127.0.0.53 valid=300s ipv6=off;
        set $github api.github.com;
        proxy_pass https://$github/repos/Warcryer/client/releases/latest;
        proxy_http_version 1.1;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "warcryer.org website";
        proxy_set_header Accept "application/vnd.github+json";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_ssl_server_name on;
        proxy_ssl_name api.github.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_cache warcryer;
        proxy_cache_key "release";
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
